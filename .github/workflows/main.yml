name: Build Android Debug APK (Adaptive CI/CD Runner)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Build variant to assemble"
        required: true
        default: "debug"
        type: choice
        options:
          - "debug"
          - "release"
      clean_build:
        description: "Perform clean build (--clean)"
        required: false
        default: false
        type: boolean
      run_lint:
        description: "Run Android Lint checks"
        required: false
        default: false
        type: boolean
      java_version:
        description: "JDK version to use"
        required: false
        default: "21"
        type: choice
        options:
          - "21"
          - "17"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build ${{ inputs.build_variant || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java JDK ${{ inputs.java_version || '21' }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java_version || '21' }}

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          # Accept SDK licenses automatically
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle & Dependency Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Verify Gradle Permissions
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> $GITHUB_ENV
          else
            echo "GRADLE_CMD=gradle" >> $GITHUB_ENV
          fi

      - name: Run Clean (Optional)
        if: ${{ inputs.clean_build == true }}
        run: $GRADLE_CMD clean

      - name: Run Android Lint (Optional)
        if: ${{ inputs.run_lint == true }}
        run: $GRADLE_CMD lintDebug || true

      - name: Test local app and terminal
        run: |
          $GRADLE_CMD :app:testDebugUnitTest \
            -Djava.awt.headless=true

      - name: Assemble Debug APK
        if: ${{ (inputs.build_variant || 'debug') == 'debug' }}
        run: |
          $GRADLE_CMD assembleDebug --stacktrace \
            -Djava.awt.headless=true

      - name: Assemble Release APK (Unsigned/Debug-signed)
        if: ${{ inputs.build_variant == 'release' }}
        run: |
          $GRADLE_CMD assembleRelease --stacktrace \
            -Djava.awt.headless=true || \
          $GRADLE_CMD assembleDebug --stacktrace \
            -Djava.awt.headless=true

      - name: Discover and Verify Output APK
        id: apk-finder
        run: |
          echo "Locating built APK..."
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found in app/build/outputs/apk"
            find . -name "*.apk"
            exit 1
          fi
          echo "APK located at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          
          # Compute hashes and sizes
          SHA256_HASH=$(sha256sum "$APK_PATH" | awk '{print $1}')
          MD5_HASH=$(md5sum "$APK_PATH" | awk '{print $1}')
          FILE_SIZE=$(du -h "$APK_PATH" | awk '{print $1}')
          
          echo "sha256=$SHA256_HASH" >> $GITHUB_OUTPUT
          echo "size=$FILE_SIZE" >> $GITHUB_OUTPUT
          
          echo "### 🚀 Android APK Build Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`$(basename "$APK_PATH")\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $FILE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256:** \`$SHA256_HASH\`" >> $GITHUB_STEP_SUMMARY
          echo "- **MD5:** \`$MD5_HASH\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Variant:** \`${{ inputs.build_variant || 'debug' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Device Profile:** Samsung SM-A326B / Kali NetHunter" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeniceAI-${{ inputs.build_variant || 'debug' }}-apk
          path: ${{ steps.apk-finder.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error
