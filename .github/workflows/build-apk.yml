name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Target Android repository (owner/repository)
        required: true
        default: Dosa42/Ngrok-portable
        type: string
      target_ref:
        description: Branch, tag, or commit (blank uses the default branch)
        required: false
        default: ''
        type: string
      variant:
        description: APK variant to build
        required: true
        default: release
        type: choice
        options:
          - debug
          - release
          - both
      dex_audit:
        description: Run the Samsung DeX compatibility audit
        required: true
        default: true
        type: boolean
      run_tests:
        description: Run discovered JVM unit tests (can fail independently of APK packaging)
        required: true
        default: false
        type: boolean
      run_lint:
        description: Run discovered Android lint tasks
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-target:
    name: Build requested Android repository
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-android-harness.yml
    with:
      target_repository: ${{ inputs.target_repository }}
      target_ref: ${{ inputs.target_ref }}
      variant: ${{ inputs.variant }}
      dex_audit: ${{ inputs.dex_audit }}
      run_tests: ${{ inputs.run_tests }}
      run_lint: ${{ inputs.run_lint }}
    secrets:
      TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
